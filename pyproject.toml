[project]
name = "regwatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anurag-2411", email = "anuragsubramaniyan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.scripts]
